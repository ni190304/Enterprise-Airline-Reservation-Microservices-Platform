spring.application.name=location-service

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.cache.type=redis

# # Config Server
# spring.config.import=optional:configserver:http://localhost:8888
# Config Server - disabled for local development
spring.cloud.config.enabled=false

# Server
server.port=5001

# MySQL - local execution
spring.datasource.url=jdbc:mysql://localhost:3305/airline_location_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true