spring.application.name=ancillary-service
server.port=5007

spring.datasource.url=jdbc:mysql://localhost:3308/airline_ancillary_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Config Server disabled for local runs
# spring.config.import=optional:configserver:http://localhost:8888/
spring.cloud.config.enabled=false
spring.config.import=optional:file:./local.properties
