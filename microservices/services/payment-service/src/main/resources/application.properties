spring.application.name=payment-service
server.port=5009

spring.datasource.url=jdbc:mysql://localhost:3310/airline_payment_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka (use localhost:9094 after the compose change)
spring.kafka.bootstrap-servers=localhost:9092

razorpay.api.base-url=http://localhost:5173/
razorpay.callback.base-url=http://localhost:5173/

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# spring.config.import=optional:configserver:http://localhost:8888/
spring.config.import=optional:file:./local.properties
spring.cloud.config.enabled=false